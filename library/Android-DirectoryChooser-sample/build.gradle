apply from: '../constants.gradle'
apply plugin: 'com.android.application'

android {
  namespace 'net.rdrei.android.dirchooser.sample'

  compileSdkVersion project.ext.compileSdkVersion
  buildToolsVersion project.ext.buildToolsVersion

  compileOptions {
    sourceCompatibility project.ext.javaVersion
    targetCompatibility project.ext.javaVersion
  }

  defaultConfig {
    minSdkVersion    project.ext.minSdkVersion
    targetSdkVersion project.ext.targetSdkVersion

    applicationId 'net.rdrei.android.dirchooser.sample'
    versionName project.ext.releaseVersion
    versionCode project.ext.releaseVersionCode
  }

  buildTypes {
    release {
      debuggable      false
      jniDebuggable   false
      minifyEnabled   true
      shrinkResources true
      proguardFiles = [
        "proguard-rules.txt",
        getDefaultProguardFile('proguard-android.txt')
      ]
    }
    debug {
      debuggable      true
      jniDebuggable   true
      minifyEnabled   false
      shrinkResources false
    }
  }

  buildFeatures {
    buildConfig false
  }

  dependenciesInfo {
    includeInApk    = false  // Disables dependency metadata when building APKs.
    includeInBundle = false  // Disables dependency metadata when building Android App Bundles.
  }

  lintOptions {
    disable 'MissingTranslation'
    abortOnError true
  }
}

dependencies {
  implementation project(':Android-DirectoryChooser-library')

  implementation      'androidx.appcompat:appcompat:'   + project.ext.jetpackVersion     // (1.0 MB) https://mvnrepository.com/artifact/androidx.appcompat/appcompat?repo=google

  compileOnly         'androidx.annotation:annotation:' + project.ext.jetpackVersion     // ( 22 KB) https://mvnrepository.com/artifact/com.android.support/support-annotations?repo=google
  annotationProcessor 'androidx.annotation:annotation:' + project.ext.jetpackVersion
}
